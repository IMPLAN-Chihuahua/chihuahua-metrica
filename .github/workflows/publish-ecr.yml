name: Build and Push to ECR (latest)

on:
  push:
    branches:
      - main
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRET_ARN="arn:aws:secretsmanager:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:secret:chihuahua-metrica/env-gERWMr"

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString --output text)

          INDICADORES_URL=$(echo "$SECRET_JSON" | jq -r '.INDICADORES_URL')
          ARBOLADO_URL=$(echo "$SECRET_JSON" | jq -r '.ARBOLADO_URL')

          echo "INDICADORES_URL=$INDICADORES_URL" >> $GITHUB_ENV
          echo "ARBOLADO_URL=$ARBOLADO_URL" >> $GITHUB_ENV

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chihuahua-metrica:latest
          build-args: |
            INDICADORES_BASE_URL=${{ env.INDICADORES_URL }}
            ARBOLADO_BASE_URL=${{ env.ARBOLADO_URL }}
